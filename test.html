<!DOCTYPE html>
<html>
<body>

<h1>Test lecture Firebase</h1>

<pre id="result">Lecture...</pre>

<script type="module">
    
import { initializeApp }
from "https://www.gstatic.com/firebasejs/12.2.1/firebase-app.js";

import {
    getDatabase,
    ref,
    onValue,
    get
}
from "https://www.gstatic.com/firebasejs/12.2.1/firebase-database.js";
    
const firebaseConfig = {
  apiKey: "AIzaSyCC7oYC2SrQK6MAdEeFw2K0G9ctBAcclt0",
  authDomain: "enreg-online.firebaseapp.com",
  databaseURL: "https://enreg-online-default-rtdb.europe-west1.firebasedatabase.app",
  projectId: "enreg-online",
  storageBucket: "enreg-online.firebasestorage.app",
  messagingSenderId: "521482799313",
  appId: "1:521482799313:web:73e9f48e1334564f849df0",
  measurementId: "G-X1RVSQYPNR"
};

// Initialize Firebase
const app = initializeApp(firebaseConfig);
const db = getDatabase(app);

// Lire /test
const testRef = ref(db, "test");

document.getElementById("result").innerText = "Connecting....";

get(testRef)
.then((snapshot) => {

    if (snapshot.exists()) {

        document.getElementById("result").innerText =
            JSON.stringify(snapshot.val(), null, 2);

    } else {

        document.getElementById("result").innerText =
            "La donnée /test n'existe pas.";

    }

})
.catch((error) => {

    document.getElementById("result").innerText =
        "ERREUR : " + error.message;

});

</script>

</body>
</html>
